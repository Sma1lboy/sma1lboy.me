<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    sma1lboy mark — 一个终端提示符:暖白的 ">" 加一块橙色光标。跟首页同一套色(深底 #101010、
    暖白 #e8e4da、强调橙 #ff7a45),首页是手册页 + 字符场,标志就是"等你敲命令"的那一格。

    favicon 的真实约束是 16px:只有两个粗形状,没有细笔画、没有渐变。手写 SVG,每个尺寸都锐利。

    这次画死深色底块:光标和暖白箭头本来就要靠深底才成立,透明底放到浅色标签栏上
    暖白箭头会直接消失。圆角让它在标签栏里读成一个图标而不是一块补丁。
  -->
  <rect width="64" height="64" rx="14" fill="#101010"/>
  <path d="M12 19 24 32 12 45" fill="none" stroke="#e8e4da" stroke-width="7.5" stroke-linecap="square"/>
  <rect x="35" y="19" width="15" height="26" fill="#ff7a45"/>
</svg>
