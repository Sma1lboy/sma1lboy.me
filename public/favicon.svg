<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    sma1lboy mark — 一道闪电劈开一个圆,深浅两半表达"被劈开"。

    favicon 的真实约束是 16px:任何细笔画都会糊掉,所以只有三个粗形状,
    没有描边、没有渐变。手写 SVG 而不是生成位图 —— 每个尺寸都锐利,体积 <1KB。

    背景透明:标签栏底色深浅不定,画死一个深色方块在浅色标签栏上就是一块突兀的补丁。

    不用错位的两个半圆:那会留一条垂直缝,而闪电是斜的,几何上盖不住,
    透明底上就是一道穿透的亮线。整圆 + 压一个深色右半,靠明度差就够读。
  -->
  <circle cx="32" cy="32" r="26" fill="#e01a3c"/>
  <path d="M32 6a26 26 0 0 1 0 52z" fill="#8b0f2a"/>
  <path d="M38 4 21 33h11L26 60 45 31H33z" fill="#ffd400"/>
</svg>
