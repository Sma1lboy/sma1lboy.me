<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    sma1lboy mark — 终端提示符 >_,配色取自 ASCII 首页(底 #101010,强调橙 #ff7a45,字 #e8e4da)。

    16px 是真实约束:只有三个粗形状,全是填充多边形,不用 <text>(favicon 里没有可靠字体)、
    不用描边。深色圆角底块让它在浅色标签栏上立得住;深色标签栏上靠橙色的 > 撑住辨识度。
  -->
  <rect width="64" height="64" rx="12" fill="#101010"/>
  <path d="M10 14h9l16 18-16 18h-9l16-18z" fill="#ff7a45"/>
  <rect x="37" y="42" width="17" height="8" fill="#e8e4da"/>
</svg>
